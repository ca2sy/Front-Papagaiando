services:
  - type: web
    name: front-papagaiando
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router: qualquer rota (ex.: /meus-perfis) abre o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://back-node-papagaiando.onrender.com
